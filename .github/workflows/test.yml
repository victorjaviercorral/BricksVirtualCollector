name: Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Tarea C1 del plan de intervención (F1.16 de la auditoría original).
    # Hasta ahora el único gate era la cobertura, así que el error de tipos que
    # rompió `next build` en la auditoría habría entrado en main sin que nada lo
    # detectara. Los pasos siguientes cierran esa brecha.

    - name: TypeScript (tsc --noEmit)
      run: npx tsc --noEmit

    - name: Vitest + umbral de cobertura
      # El script test:coverage usa vitest --coverage, que comprueba los umbrales
      # configurados en vitest.config.ts (85% en las 4 métricas). Si la cobertura
      # baja de ahí, el comando sale con código distinto de cero y bloquea el merge.
      run: npm run test:coverage

    - name: ESLint (baseline congelado)
      # Tarea C2. ESLint arrastra 201 errores preexistentes; ninguna regla se ha
      # relajado ni desactivado para ocultarlos. El gate no exige bajarlos, exige
      # que no suban: la deuda queda congelada y cualquier PR que añada un error
      # nuevo falla aquí. Al reducirla, bajar ESLINT_BASELINE en el mismo PR.
      run: npm run lint:ci

    - name: Build de producción
      # Verifica que existe artefacto desplegable. `next build` detecta errores
      # que tsc no ve por sí solo (tipado de rutas, fronteras Server/Client).
      # Comprobado el 18/08/2026: el build termina en verde sin estas variables
      # (las 41 rutas son dinámicas, ninguna consulta Supabase en tiempo de build),
      # así que si los secrets no están definidos el gate sigue siendo válido.
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      run: npx next build
